project:
  name: CMSSL-RFSQ-MR-frequency-FSQ
  version: band_rmsnorm_v1
  root: ${hydra:runtime.cwd}
experiment:
  name: teacher_band_rmsnorm_v1_seed42_fast
  stage: teacher
data:
  val_file: null
  prepared_dir: ${oc.env:PULSEDB_ROOT}
  batch_size: 128
  num_workers: 4
  num_patches: 50
  patch_size: 25
  stride: 1250
  val_split: 0.1
  seed: 42
  shard_size: 16384
  auto_prepare: false
  force_rebuild: false
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 2
  cuda_prefetch: false
  cuda_prefetch_depth: 1
  sampling_mode: shard_sequential
  subset_fraction_train: 1.0
  subset_fraction_val: 1.0
trainer:
  accelerator: gpu
  devices: 1
  precision: bf16-mixed
  max_epochs: 200
  max_steps: -1
  limit_train_batches: 1.0
  limit_val_batches: 1.0
  gradient_clip_val: 1.0
  gradient_clip_algorithm: norm
  strategy: auto
  log_every_n_steps: 50
  check_val_every_n_epoch: 1
  val_check_interval: null
  enable_progress_bar: false
  enable_model_summary: false
  sync_batchnorm: false
  num_sanity_val_steps: 0
early_stopping:
  enabled: true
  monitor: val/loss
  patience: 20
  mode: min
  min_delta: 1.0e-05
checkpoint:
  dirpath: ${hydra:runtime.cwd}/outputs/pretraining/teacher
  filename: teacher
  monitor: val/loss
  mode: min
  save_top_k: 1
  save_last: true
  auto_insert_metric_name: false
logging:
  dirpath: ${hydra:runtime.cwd}/outputs/pretraining/logs/teacher
  name: teacher_band_rmsnorm_v1_seed42_fast
extra_callbacks: []
resume_from_checkpoint: null
use_wandb: false
wandb:
  project: ${project.name}
  entity: null
  name: ${experiment.name}
  group: band_rmsnorm_v1_fast_teacher_seed42
  tags:
  - band-rmsnorm
  - teacher
  - seed42
  id: null
  resume: never
  mode: online
  log_model: false
  save_dir: ${hydra:runtime.cwd}/logs/wandb
model:
  _target_: src.models.frequency_fsq.FrequencyFSQTokenizer
  num_patches: 50
  patch_size: 25
  max_seq_length: 1250
  sample_rate: 125.0
  wavelet: sym4
  wavelet_level: 5
  band_groups: null
  embed_dim: 128
  num_encoder_heads: 8
  num_encoder_layers: 10
  num_decoder_heads: 8
  num_decoder_layers: 4
  drop_rate: 0.1
  learning_rate: 0.0001
  weight_decay: 1.0e-05
  total_epochs: ${trainer.max_epochs}
  min_lr: 1.0e-06
  lr_scheduler_type: none
  channel_weights:
  - 1.0
  - 1.0
  band_weights: null
  band_scales: null
  decoder_type: patch_mlp
  input_normalization: band_rmsnorm
  input_rmsnorm_eps: 1.0e-06
  input_band_channel_scales: null
  band_channel_scales:
  - - 0.2877156436443329
    - 0.4161023199558258
  - - 0.04768368601799011
    - 0.09618352353572845
  - - 0.057895902544260025
    - 0.03300910443067551
  - - 0.08163987100124359
    - 0.007564697880297899
training_acceleration:
  wavelet_response_cache: true
  fused_adamw: true
  compile: false
  compile_mode: default
  train_diagnostics_interval: 100
profile:
  enabled: false
  warmup_steps: 10
  log_every_n_steps: 20
  output_jsonl: ${hydra:runtime.output_dir}/training_profile.jsonl
hydra:
  job:
    chdir: false
  run:
    dir: ${hydra:runtime.cwd}/outputs/runs/${experiment.name}/${now:%Y%m%d_%H%M%S}
